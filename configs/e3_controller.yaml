# E3Controller configuration.
#
# This is the only argument the controller takes:  e3_controller --config <this file>
#
# Unknown keys are a startup ERROR, not a warning. A typo'd `nof_port:` that was
# silently ignored would leave the controller sizing rows for the default while
# you believed you had configured something else — which is the exact failure
# this file exists to prevent.

# ---------------------------------------------------------------------------
# Radio geometry — MUST match the running gNB.
#
# Checked, not trusted: the controller compares these against the geometry the
# RAN reports in the first slot (jbpf_ran_slot_ctx carries nof_ports /
# nof_symbols / nof_subcarriers) and refuses to publish on a mismatch.
#
# The asymmetry worth knowing: declaring FEWER ports than the gNB sends is
# already safe (the gNB-side helper refuses and the codelet flags it). Declaring
# MORE is what needs the check — the surplus antennas get written as silence and
# the dApp cannot tell them from a genuinely quiet antenna.
# ---------------------------------------------------------------------------
radio:
  nof_ports:   4       # UL antenna ports (1..8)
  nof_prbs:    273     # 100 MHz @ 30 kHz SCS
  nof_symbols: 14      # per slot (12 or 14)
  scs_khz:     30      # 15 | 30 | 60 | 120 — also fixes slots/frame (20 @ 30 kHz)

# ---------------------------------------------------------------------------
# /e3_ran_buffers — the region the controller OWNS and the dApp reads.
# Layout matches SharedMemoryHeader in the NVIDIA L1 KPM SM / cuBB contract.
# ---------------------------------------------------------------------------
shm:
  name:        /e3_ran_buffers
  size_bytes:  134217728    # 128 MiB
  # Sizing, from e3sm_shm_writer.cpp:176-187 — the region is a DOUBLE-buffered
  # ring, so rows-per-buffer = (size_bytes - sizeof(SharedMemoryHeader)) / 2 /
  # row_bytes, and row_bytes for 4 ports x 273 PRB x 14 sym is 733,824 B.
  #
  #   1 GiB   -> 731 rows/buffer  (1462 total, ~2.2 s at 650 slots/s)
  #   128 MiB ->  91 rows/buffer  ( 182 total, ~280 ms)          <-- here
  #    24 MiB ->  17 rows/buffer  (  34 total, ~52 ms)
  #
  # 1 GiB bought nothing: the dApp drains a row in ~150 us end to end, so even
  # the smallest option above is ~340x more buffering than the consumer needs.
  # What it did cost is a 1 GiB zero-fill at open() (the memset on line 164) and
  # a third of this pod's 4 GiB /dev/shm, which also has to hold the 1 GiB jbpf
  # IO region below.
  #
  # 128 MiB is the size the previous pod actually ran at. 24 MiB is the next
  # step down and is close to OAI's own geometry (E3_RB_NUM_FH_ROWS = 16), but
  # has not been run here yet.
  #
  # Too small is loud, not silent: under one row per buffer, open() fails with
  # "SHM size N too small for one row".

  # bf16 -> fp16 scale, applied when converting the resource grid to the row.
  # Was the E3_CBF16_SCALE environment variable; it lives here now because the
  # gNB-side publish helper needs the SAME value (pushed down via e3_shm_cfg),
  # and a disagreement would produce different rows with no error at all —
  # bf16 and fp16 are both 2 bytes, so a wrong scale is silently wrong data.
  #
  # Must be > 0. Zero or negative zeroes the row and breaks the dApp silently.
  cbf16_scale: 1.0

  # Which process converts the grid and writes the fp16 rows.
  #
  # EXACTLY ONE may write. Both this controller and the gNB-side publish helper
  # keep their own ring cursor, so if both were active they would overwrite each
  # other's rows with no error at all. This switch makes that impossible rather
  # than a convention: in `gnb` mode the controller's writer hard-refuses.
  #
  #   controller  today's path -- the codelet copies the grid into the jbpf ring
  #               and this process converts it. Works against any gNB.
  #
  #   gnb         publish-direct -- the codelet calls the gNB-side helper, which
  #               converts and writes the row in the PHY RX thread. The jbpf ring
  #               then carries only a ~64 B descriptor and this process never
  #               touches the data plane. Halves total memory traffic, but
  #               REQUIRES a gNB with the E3 helpers registered and the
  #               descriptor-emitting codelet loaded.
  #
  # Either way the controller OWNS the region: it creates, sizes, zero-fills,
  # headers and tears it down. The helper only attaches.
  writer: gnb

# ---------------------------------------------------------------------------
# jbpf IPC. Must agree with the gNB's own `jbpf:` YAML section.
# ---------------------------------------------------------------------------
jbpf:
  ipc_name:          e3_controller
  run_path:          /dev/shm
  mem_size_bytes:    1073741824
  # LCM socket the gNB exposes for codelet loading.
  #
  # The gNB builds this path as <jbpf_run_path>/<jbpf_namespace>/<jbpf_lcm_ipc_name>
  # from its own YAML, so with the usual
  #   jbpf_run_path: "/dev/shm", jbpf_namespace: "jbpf", jbpf_lcm_ipc_name: "jbpf_lcm_ipc"
  # it lands at /dev/shm/jbpf/jbpf_lcm_ipc — NOT /tmp.
  #
  # Leave this commented out and it is derived from run_path above, which keeps
  # the two in step automatically. Set it only if your gNB uses a non-default
  # namespace or socket name.
  # lcm_socket_path: /dev/shm/jbpf/jbpf_lcm_ipc
  # Directory holding the codeletsets. Resolved by the LCM load request, so it
  # must be the path as seen by the gNB. Empty disables auto-loading.
  codelet_base_path: /workspace/e3_improved/E3Controller/codelets

# ---------------------------------------------------------------------------
# E3 channel. One encoding is served at a time; dApps must speak the same one.
# ASN.1 (APER) is the O-RAN default; JSON matches the cuBB convention the
# adaptive_cpu dApp uses (with ports 5555/5556/5557).
# ---------------------------------------------------------------------------
e3:
  # JSON, because the adaptive_cpu dApp on feat/latency-tracing is JSON-ONLY:
  # it ships no asn1_receiver and parses no --encoding flag, and its
  # config/e3_config.json declares the NVIDIA_L1 agent on 5555/5556/5557. ASN.1
  # here would leave the two talking past each other on different ports.
  #
  # (The dApp's `feat/asn` branch does speak APER on 9990/9991/9999, but it
  # deliberately excludes the latency instrumentation, so it is not the branch
  # to use for a tracing run.)
  encoding:        json   # asn1 | json
  link_layer:      zmq    # zmq | posix
  transport:       tcp    # tcp | ipc | sctp
  # Must match e3_manager.e3_agents[NVIDIA_L1] in the dApp's e3_config.json.
  setup_port:      5555   # agent_rep_port
  publisher_port:  5556   # agent_pub_port
  subscriber_port: 5557   # agent_sub_port

# ---------------------------------------------------------------------------
# Thread placement. -1 = no pinning (the poll thread then sleeps between polls
# rather than busy-spinning).
#
# Pin these. Unpinned is not a neutral default here: it cost zmq_send 2.66 ->
# 16.35 us and L2->L3 send 5.44 -> 19.52 us in back-to-back runs, because the
# publisher loses socket/cache locality. It does NOT help the outbound queue
# wait (53.32 vs 52.31 us either way) -- that one is set by the poller's period
# in libe3's lockfree_queue.hpp, not by placement.
#
# Cores must exist in the pod's cpuset or pinning fails outright; check with
#   grep Cpus_allowed_list /proc/self/status
# Values below are for ocudu-e3-rusim, whose cpuset is the ODD cores 9..31.
# Keep them disjoint from the dApp's, which are set separately in
# run_scripts/start_adaptive_cpu.sh (CORES=). The srsran-janus-dpdk-x86 pod had
# the EVEN map and wanted 38/40/42 instead.
# ---------------------------------------------------------------------------
threads:
  poll_core:        -1
  worker_core:      -1
  publisher_core:   -1
  poll_interval_us: 100

logging:
  # Per-slot RAN-side stage CSV (gnb -> codelet -> dispatch -> handler, plus
  # shm/encode/emit costs). Empty disables it.
  #
  # Setting this also enables the DROP CSV, written alongside as
  # <path minus extension>_drops<extension> -- here /tmp/e3c_stages_drops.csv.
  # It carries one cumulative row per second: published, dropped_total, and a
  # column per reason (no_subscribers, ran_published_nothing, blob_too_small,
  # ...). The drop COUNTERS themselves are always on: the throttled live stderr
  # line and the shutdown summary do not depend on this path.
  stats_log_path: "/tmp/e3c_stages.csv"

# ---------------------------------------------------------------------------
# Legacy controller-side single-slot filter: slot index within a 10 ms frame
# (0..slots_per_frame()-1). -1 disables.
#
# Note this drops the slot AFTER the RAN has already converted and published it,
# so it saves the controller work and the RAN nothing. Workstream F's
# codelet-side slot_mask supersedes it by deciding before any data moves.
# ---------------------------------------------------------------------------
target_slot: -1
